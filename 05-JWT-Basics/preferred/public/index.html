<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Lord of the Rings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding: 30px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .form-container input {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-container button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
        .welcome-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .welcome-container h2 {
            font-size: 28px;
            color: #333;
        }
        .back-button {
            background-color: #ff6347;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: #e54a35;
        }
    </style>
</head>
<body>

    <div id="loginContainer" class="form-container">
        <h1>Speak, friend, and enter</h1>
        <h2>Login to Middle-earth</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Enter your username" required />
            <input type="password" id="password" placeholder="Enter your password" required />
            <button type="submit">Log In</button>
        </form>
    </div>

    <div id="welcomeContainer" class="welcome-container" style="display: none;">
        <h2>Welcome to Moria, the Kingdom of Dwarves!</h2>
        <p>You have entered the great halls of the Dwarves. Only those with the strength of character can pass.</p>
        <button id="backButton" class="back-button">Back to Login</button>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginContainer = document.getElementById('loginContainer');
        const welcomeContainer = document.getElementById('welcomeContainer');
        const backButton = document.getElementById('backButton');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/logon', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                if (!response.ok) {
                    throw new Error('Invalid credentials');
                }

                const data = await response.json();
                const token = data.token;

                localStorage.setItem('token', token);

                // Show hello page and disable form
                loginContainer.style.display = 'none';
                welcomeContainer.style.display = 'block';
            } catch (error) {
                alert(error.message); // Error message
            }
        });

        // Login return button
        backButton.addEventListener('click', () => {
            loginContainer.style.display = 'block';
            welcomeContainer.style.display = 'none';
        });
    </script>

</body>
</html>
